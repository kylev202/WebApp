<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loop">
<meta name="description" content="Loop: my personal life manager for diet, gym, sleep, uni, work and money.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<title>Loop</title>
</head>
<body>
<div class="wallpaper"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="bubbles" aria-hidden="true">
    <i style="--x:6%;--s:34px;--d:21s;--w:-4s;--c:rgba(180,178,239,.5)"></i>
    <i style="--x:22%;--s:14px;--d:16s;--w:-11s;--c:rgba(244,167,181,.55)"></i>
    <i style="--x:38%;--s:24px;--d:24s;--w:-17s;--c:rgba(143,211,168,.5)"></i>
    <i style="--x:55%;--s:12px;--d:15s;--w:-2s;--c:rgba(169,205,242,.6)"></i>
    <i style="--x:68%;--s:40px;--d:27s;--w:-9s;--c:rgba(247,205,150,.45)"></i>
    <i style="--x:82%;--s:18px;--d:18s;--w:-14s;--c:rgba(147,216,211,.55)"></i>
    <i style="--x:92%;--s:26px;--d:22s;--w:-20s;--c:rgba(180,178,239,.5)"></i>
    <i style="--x:47%;--s:10px;--d:13s;--w:-7s;--c:rgba(244,167,181,.55)"></i>
  </div>
</div>

<div class="topbar" id="topbar"><span id="topbar-title">Today</span></div>

<main id="main"></main>

<nav class="tabbar glass" aria-label="Tabs">
  <span class="tab-ind" id="tab-ind"></span>
  <button class="tab" data-act="nav" data-to="today"><i data-icon="grid"></i>Today</button>
  <button class="tab" data-act="nav" data-to="health"><i data-icon="heart"></i>Health</button>
  <button class="tab ask" data-act="nav" data-to="ask" aria-label="Ask Loop"><div class="orb"><i data-icon="sparkle"></i></div></button>
  <button class="tab" data-act="nav" data-to="plan"><i data-icon="calendar"></i>Plan</button>
  <button class="tab" data-act="nav" data-to="money"><i data-icon="wallet"></i>Money</button>
</nav>

<div id="sheet"></div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>
<input type="file" id="restore-input" accept="application/json,.json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
