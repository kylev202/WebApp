<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121113" media="(prefers-color-scheme: dark)">
<title>Apps</title>
<style>
  :root { --bg: #f8f6f2; --card: #fff; --ink: #1c1b1f; --muted: #6b6870; --line: #e7e3dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121113; --card: #1d1c1f; --ink: #f2f0ec; --muted: #9a979e; --line: #2c2a2e; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 20px; background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 20px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: inherit; text-decoration: none; }
  img { width: 52px; height: 52px; border-radius: 12px; flex: none; }
  b { display: block; font-size: 17px; }
  span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <ul>
    <li><a href="loops/"><img src="loops/icons/icon-192.png" alt=""><div><b>Loop</b><span>Diet, gym, sleep, uni, work and money</span></div></a></li>
    <li><a href="roadmap/"><img src="roadmap/icon.svg" alt=""><div><b>Placement Roadmap</b><span>The year to the 2028 placement, week by week</span></div></a></li>
    <!-- Add each new app here: <li><a href="folder/">…</a></li> -->
  </ul>
</main>
<!-- Loop used to live at this address. Remove its old service worker here so it can't keep serving the old copy offline. -->
<script>navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => { if (new URL(r.scope).pathname === location.pathname.replace(/[^/]*$/, '')) r.unregister(); })).catch(() => {});</script>
</body>
</html>
